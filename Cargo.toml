[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hyperb-core = { path = "crates/core" }
hypereffect = "0.2"
tokio = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
