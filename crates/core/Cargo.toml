[package]
name = "hyperb-core"
version.workspace = true
edition.workspace = true

[lib]
name = "hyperb_core"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
hypereffect = { workspace = true, features = ["client"] }
url = "2"
ed25519-dalek = "2"
hex = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
async-channel = { version = "2", optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["stream"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
iroh = { version = "1.3", optional = true }
wasmtime = { version = "48", default-features = false, features = ["runtime", "cranelift", "std", "wat"], optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"], optional = true }

# Android: rustls on ring, verifying with the system trust store through
# rustls-platform-verifier (the host must call its `android::init_with_env`).
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = []
# Transports (HTTP with SSE). On native hosts they run on a background tokio
# runtime; on wasm32 they use fetch and the browser's event loop.
net = ["dep:async-channel", "dep:futures-util", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:wasm-bindgen-futures", "dep:wasm-bindgen", "dep:js-sys"]
# Sessions over iroh and local/remote wasm apps (native hosts only).
iroh = ["net", "dep:iroh"]
wasm = ["net", "dep:wasmtime"]
