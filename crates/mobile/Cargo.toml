[package]
name = "hyperb-mobile"
version.workspace = true
edition.workspace = true

[lib]
name = "hyperb_mobile"
crate-type = ["cdylib"]

[dependencies]
# Sessions over iroh; wasm runs on wasmtime: Cranelift on arm64 and x86_64, its Pulley
# interpreter on 32-bit ARM.
hyperb-core = { workspace = true, features = ["net", "wasm", "iroh"] }
url = "2"
async-channel = "2"
jni = "0.22"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# The same instance reqwest verifies certificates with; it needs the app context.
rustls-platform-verifier = "0.7"
