[package]
name = "hyperb-wasmapps"
version.workspace = true
edition.workspace = true
publish = false

# One demo app per build, chosen by feature: `just wasm-apps` builds each into
# its own module. With no feature the crate is empty.

[lib]
name = "wasmapps"
crate-type = ["cdylib"]

[dependencies]
hyperb-demoapps = { path = "../demoapps", default-features = false }
hypereffect.workspace = true
getrandom = { version = "0.3", optional = true }

[features]
default = []
billsplit = []
chart = []
dbclient = []
finance = []
# Harper needs random numbers: build with `--cfg getrandom_backend="custom"`.
grammar = ["hyperb-demoapps/grammar", "dep:getrandom"]
minecraft = []
pomodoro = []
qr = []
restaurant = []
saas = []
smarthome = []
textstats = []
therapist = []

[dev-dependencies]
hyperb-core = { workspace = true, features = ["wasm"] }
