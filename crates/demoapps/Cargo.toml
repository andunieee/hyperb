[package]
name = "hyperb-demoapps"
version.workspace = true
edition.workspace = true
publish = false

# The demo apps, which `hyperb-wasmapps` builds as wasm modules.

[lib]
name = "demoapps"

[dependencies]
hypereffect.workspace = true
png = "0.18"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
harper-core = { version = "2.13.0", optional = true }

[features]
default = ["grammar"]
# The grammar checker, on Harper, which is large to build.
grammar = ["dep:harper-core"]

[dev-dependencies]
hypereffect = { workspace = true, features = ["client"] }
