[package]
name = "hyperb-web"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hyperb-web"
path = "src/main.rs"

[lib]
name = "hyperb_web"
path = "src/app.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
hyperb-core.workspace = true
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"], optional = true }
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions", "FileSystemWritableFileStream", "History", "Location", "Navigator",
    "PageTransitionEvent", "Storage", "StorageManager", "UrlSearchParams", "Window", "WritableStream",
] }
hex = { version = "0.4", optional = true }
url = { version = "2", optional = true }

[features]
default = ["ssr"]
ssr = ["dep:leptos_axum", "dep:axum", "dep:tokio", "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]
hydrate = ["leptos/hydrate", "hyperb-core/net", "hyperb-core/iroh", "hyperb-core/wasm", "dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:hex", "dep:url"]

[package.metadata.leptos]
output-name = "hyperb-web"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
