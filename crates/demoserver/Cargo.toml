[package]
name = "hyperb-demoserver"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "hyperb-demoserver"
path = "src/main.rs"

[dependencies]
hyperb-core.workspace = true
hyperb-demoapps = { path = "../demoapps" }
hypereffect.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
iroh = "1.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util.workspace = true
getrandom = "0.2"
hex = "0.4"
harper-core = "2.13.0"

[dev-dependencies]
hyperb-core = { workspace = true, features = ["iroh", "wasm"] }
