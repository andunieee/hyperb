name: Build Windows installer

# Builds the GTK4 desktop app with MSYS2's UCRT64 toolchain and packages it as
# an installer (Start menu entry, uninstaller, hyperb:// handler) and a portable
# .zip. GTK4 cannot be linked statically, so all runtime libraries ship in the
# bundle. Runs on "desktop-*" tags and attaches both to the GitHub release.

on:
  push:
    tags: ["desktop-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: false
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cargo build --release --locked -p hyperb-desktop

      - name: Package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            # desktop-5-1 -> 5.1
            VERSION="$(echo "${GITHUB_REF_NAME#desktop-}" | tr - .)"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi

          # Bundle layout mirrors an msys2 install prefix; on Windows glib
          # resolves glib/gtk resource dirs *relative to the DLL location*,
          # so putting DLLs in bundle/bin and resources under bundle/share
          # and bundle/lib makes the tree relocatable without env tricks.
          mkdir -p bundle/bin \
            bundle/share/glib-2.0/schemas \
            bundle/share/icons \
            bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders

          cp target/release/hyperb-desktop.exe bundle/bin/

          cp /ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders/

          # Copy every dependency DLL (recursively via ntldd) of the binary and
          # of the dlopen()ed pixbuf loaders, skipping the Windows system ones
          # that are already present on any machine. ntldd prints Windows paths
          # ("D:\a\_temp\msys64\ucrt64\bin\foo.dll", runner root varies), so the
          # backslashes are turned into slashes before matching.
          ntldd -R bundle/bin/hyperb-desktop.exe bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll \
            | tr -s '[:space:]' '\n' | tr '\\' '/' | while read -r tok; do
            case "$tok" in
              /ucrt64/*|?:/*)
                unix="$(cygpath -u "$tok")"
                case "$unix" in
                  */ucrt64/bin/*.dll)
                    [ -e "bundle/bin/$(basename "$unix")" ] || cp "$unix" bundle/bin/ ;;
                esac ;;
            esac
          done

          # Fail here rather than ship a bundle that can't start.
          for dll in libgtk-4-1.dll libcairo-2.dll libcairo-gobject-2.dll \
            libgdk_pixbuf-2.0-0.dll libglib-2.0-0.dll; do
            [ -e "bundle/bin/$dll" ] || { echo "missing $dll in the bundle"; exit 1; }
          done

          # glib schemas (compiled), icon theme, pixbuf loaders cache.
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled bundle/share/glib-2.0/schemas/
          cp -r /ucrt64/share/icons/hicolor bundle/share/icons/
          # The app icon by name (window icon).
          mkdir -p bundle/share/icons/hicolor/scalable/apps
          cp assets/icon.svg bundle/share/icons/hicolor/scalable/apps/com.hyperb.app.svg
          (cd bundle && gdk-pixbuf-query-loaders lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll \
            > lib/gdk-pixbuf-2.0/2.10.0/loaders.cache)

          # CRLF batch wrapper for the portable zip (LF breaks cmd.exe).
          printf '@echo off\r\nset GDK_PIXBUF_MODULE_FILE=%%~dp0lib\\gdk-pixbuf-2.0\\2.10.0\\loaders.cache\r\nstart "" "%%~dp0bin\\hyperb-desktop.exe" %%*\r\n' > bundle/hyperb.bat

          mkdir -p dist
          # Inno Setup comes with the runner image.
          # MSYS would rewrite the /D switches as POSIX paths, so skip its argument conversion.
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DVersion=${VERSION}" "/DBundle=$(cygpath -w "$PWD/bundle")" "/DOutput=$(cygpath -w "$PWD/dist")" \
            "$(cygpath -w "$PWD/crates/desktop/windows/hyperb.iss")"
          powershell -NoProfile -Command "Compress-Archive -Force -Path bundle/* -DestinationPath 'dist/hyperb-windows-x64-v${VERSION}.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
