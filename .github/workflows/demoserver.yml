name: Build demoserver

# Builds the demo server together with its wasm apps for Linux, macOS and Windows and attaches
# the archives to the GitHub release. Runs on "demoserver-<N>-<M>" tags.

on:
  push:
    tags: ["demoserver-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, exe: "" }
          - { os: macos-latest, name: macos-arm64, exe: "" }
          - { os: windows-latest, name: windows-x64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build the wasm apps
        run: just wasm-apps

      - name: Build
        run: cargo build --release --locked -p hyperb-demoserver

      - name: Package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="$(echo "${GITHUB_REF_NAME#demoserver-}" | tr - .)"
          else
            VERSION=dev
          fi
          # The server looks for wasm-apps/ in its working directory.
          base="hyperb-demoserver-${{ matrix.name }}-v${VERSION}"
          mkdir -p dist "$base"
          cp "target/release/hyperb-demoserver${{ matrix.exe }}" "$base/"
          cp -r wasm-apps "$base/"
          if [ "${{ matrix.exe }}" = .exe ]; then
            7z a "dist/${base}.zip" "$base"
          else
            tar czf "dist/${base}.tar.gz" "$base"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: demoserver-${{ matrix.name }}
          path: dist/

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
