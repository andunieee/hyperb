name: Publish hyperb-core to crates.io

# Publishes the core library on "core-<N>-<M>" tags (for example core-1-2),
# which maps to crate version 0.<N>.<M> (0.1.2 above). Set the CRATES_IO_TOKEN
# secret to an API token with publish rights for hyperb-core.
#
# A manual run publishes the version given as input; leave "publish" off to
# only run the dry run.

on:
  push:
    tags: ["core-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Crate version to publish (for example 0.1.2)"
        required: true
      publish:
        description: "Actually publish (otherwise only a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME#core-}"
            if ! [[ "$tag" =~ ^[0-9]+-[0-9]+$ ]]; then
              echo "tag ${GITHUB_REF_NAME} is not core-<N>-<M>" >&2
              exit 1
            fi
            version="0.${tag/-/.}"
          else
            version="${{ inputs.version }}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version '$version' is not x.y.z" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set the crate version
        run: |
          set -euo pipefail
          sed -i -E "s/^version = \"[^\"]+\"\$/version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml
          grep -n '^version' Cargo.toml

      - name: Test
        run: cargo test -p hyperb-core

      - name: Publish (dry run)
        run: cargo publish -p hyperb-core --allow-dirty

      - name: Publish
        if: github.ref_type == 'tag' || inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p hyperb-core --allow-dirty
